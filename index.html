<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="app-title">WoW Crafting & Economy Hub</title>
    <style>
        :root {
            --bg-main: #060913;
            --bg-card: rgba(15, 23, 42, 0.92);
            --bg-input: rgba(30, 41, 59, 0.85);
            --border-color: rgba(51, 65, 85, 0.8);
            --accent-gold: #f59e0b;
            --accent-glow: rgba(245, 158, 11, 0.25);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --green: #10b981;
            --red: #ef4444;
        }

        body.theme-alliance { --accent-gold: #3b82f6; --accent-glow: rgba(59, 130, 246, 0.25); }
        body.theme-horde { --accent-gold: #dc2626; --accent-glow: rgba(220, 38, 38, 0.25); }
        body.theme-fel { --accent-gold: #10b981; --accent-glow: rgba(16, 185, 129, 0.25); }

        body {
            background-color: var(--bg-main);
            background-image: 
                radial-gradient(circle at 50% 10%, var(--accent-glow) 0%, transparent 60%),
                radial-gradient(circle at 90% 90%, rgba(30, 58, 138, 0.15) 0%, transparent 50%),
                linear-gradient(rgba(6, 9, 19, 0.92), rgba(6, 9, 19, 0.98));
            background-attachment: fixed;
            color: var(--text-main);
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            margin: 0;
            padding: 20px 10px;
            min-height: 100vh;
            box-sizing: border-box;
        }

        .container {
            max-width: 1100px;
            margin: 0 auto;
            background: var(--bg-card);
            backdrop-filter: blur(12px);
            border: 1px solid var(--border-color);
            padding: 20px;
            border-radius: 16px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.8), 0 0 40px var(--accent-glow);
            box-sizing: border-box;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 15px;
            flex-wrap: wrap;
            gap: 15px;
        }

        h1 {
            margin: 0;
            font-size: 1.5rem;
            color: var(--accent-gold);
            font-weight: 800;
            letter-spacing: -0.5px;
        }

        .header-controls {
            display: flex;
            gap: 8px;
            align-items: center;
            flex-wrap: wrap;
            width: 100%;
        }

        .donate-btn {
            background: linear-gradient(135deg, #e11d48, #be123c);
            color: #fff;
            border: none;
            padding: 10px 14px;
            border-radius: 10px;
            font-weight: 700;
            font-size: 0.85rem;
            cursor: pointer;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            box-shadow: 0 4px 15px rgba(225, 29, 72, 0.3);
            transition: all 0.2s;
            flex: 1;
            justify-content: center;
            min-width: 130px;
        }
        .donate-btn:hover { filter: brightness(1.1); }

        .ad-banner {
            background: rgba(30, 41, 59, 0.4);
            border: 1px dashed var(--border-color);
            text-align: center;
            padding: 12px;
            border-radius: 12px;
            color: var(--text-muted);
            font-size: 0.8rem;
            margin-bottom: 20px;
        }

        select, input {
            background: var(--bg-input);
            color: var(--text-main);
            border: 1px solid var(--border-color);
            padding: 12px 14px;
            border-radius: 10px;
            font-size: 0.95rem;
            outline: none;
            width: 100%;
            box-sizing: border-box;
            transition: all 0.25s ease;
        }

        select:focus, input:focus {
            border-color: var(--accent-gold);
            box-shadow: 0 0 0 3px var(--accent-glow);
        }

        .nav-tabs {
            display: flex;
            gap: 8px;
            margin-bottom: 20px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 12px;
            overflow-x: auto;
        }

        .tab-btn {
            background: transparent;
            border: 1px solid transparent;
            color: var(--text-muted);
            font-size: 0.88rem;
            font-weight: 600;
            padding: 8px 14px;
            cursor: pointer;
            border-radius: 10px;
            white-space: nowrap;
            transition: all 0.2s ease;
        }

        .tab-btn:hover {
            color: var(--text-main);
            background: rgba(255, 255, 255, 0.03);
            border-color: var(--border-color);
        }

        .tab-btn.active {
            color: var(--accent-gold);
            background: var(--accent-glow);
            border: 1px solid var(--accent-gold);
        }

        .realm-config-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 15px;
            margin-bottom: 20px;
        }

        .controls-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 15px;
            margin-bottom: 20px;
        }

        .control-group label {
            display: block;
            font-size: 0.72rem;
            color: var(--text-muted);
            margin-bottom: 6px;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: 700;
        }

        .professions-nav {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin-bottom: 20px;
            overflow-x: auto;
            padding-bottom: 5px;
        }

        .prof-btn {
            background: var(--bg-input);
            border: 1px solid var(--border-color);
            color: var(--text-muted);
            padding: 6px 12px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 0.82rem;
            font-weight: 600;
            white-space: nowrap;
            transition: all 0.2s;
        }

        .prof-btn:hover { color: var(--text-main); border-color: var(--accent-gold); }
        .prof-btn.active {
            background: var(--accent-gold);
            color: #060913;
            border-color: var(--accent-gold);
            font-weight: 800;
            box-shadow: 0 4px 15px var(--accent-glow);
        }

        .main-action-btn {
            background: linear-gradient(135deg, var(--accent-gold), #b45309);
            color: #060913;
            border: none;
            padding: 14px;
            font-weight: 800;
            border-radius: 12px;
            cursor: pointer;
            width: 100%;
            font-size: 1rem;
            box-shadow: 0 4px 20px var(--accent-glow);
            transition: all 0.2s ease;
        }
        .main-action-btn:hover { filter: brightness(1.1); }

        .recipe-card {
            background: rgba(10, 15, 30, 0.7);
            border: 1px solid var(--border-color);
            padding: 15px;
            border-radius: 14px;
            border-left: 4px solid var(--accent-gold);
            margin-top: 20px;
            box-sizing: border-box;
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.85rem;
            margin: 15px 0;
            min-width: 450px;
        }

        th {
            background: rgba(30, 41, 59, 0.9);
            color: var(--text-muted);
            text-align: left;
            padding: 10px;
            font-weight: 700;
            font-size: 0.75rem;
            text-transform: uppercase;
        }

        td { padding: 10px; border-bottom: 1px solid var(--border-color); }

        .summary-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            background: rgba(6, 9, 19, 0.8);
            padding: 15px;
            border-radius: 12px;
            border: 1px solid var(--border-color);
            text-align: center;
            margin-top: 20px;
        }

        .summary-box span {
            font-size: 0.68rem;
            color: var(--text-muted);
            display: block;
            margin-bottom: 4px;
            text-transform: uppercase;
            font-weight: 700;
        }

        .summary-box strong { font-size: 1.1rem; font-weight: 800; }

        .badge-thermometer {
            display: inline-block;
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 800;
            margin-top: 6px;
        }

        .badge-green { background: rgba(16, 185, 129, 0.15); color: var(--green); border: 1px solid rgba(16, 185, 129, 0.4); }
        .badge-yellow { background: rgba(245, 158, 11, 0.15); color: var(--accent-gold); border: 1px solid rgba(245, 158, 11, 0.4); }
        .badge-red { background: rgba(239, 68, 68, 0.15); color: var(--red); border: 1px solid rgba(239, 68, 68, 0.4); }

        .action-row-buttons { display: flex; flex-direction: column; gap: 10px; margin-top: 20px; }

        .secondary-btn {
            background: var(--bg-input);
            color: var(--text-main);
            border: 1px solid var(--border-color);
            padding: 12px;
            border-radius: 10px;
            cursor: pointer;
            font-weight: 700;
            font-size: 0.88rem;
            text-align: center;
            transition: all 0.2s;
        }
        .secondary-btn:hover { border-color: var(--accent-gold); color: var(--accent-gold); }

        .input-owned {
            width: 55px;
            padding: 6px;
            text-align: center;
            background: var(--bg-main);
            border: 1px solid var(--border-color);
            color: #fff;
            border-radius: 6px;
            font-weight: 700;
        }

        .input-price {
            width: 100px;
            padding: 8px;
            background: var(--bg-main);
            border: 1px solid var(--border-color);
            color: var(--accent-gold);
            font-weight: 800;
            border-radius: 6px;
            text-align: right;
        }

        .fav-btn {
            background: transparent;
            border: none;
            color: var(--text-muted);
            font-size: 1.4rem;
            cursor: pointer;
        }
        .fav-btn.active { color: var(--accent-gold); }

        .tab-content { display: none; }
        .tab-content.active { display: block; animation: fadeIn 0.3s ease; }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(4px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* DISEÑO PARA COMPUTADORAS Y PANTALLAS GRANDES */
        @media (min-width: 768px) {
            body { padding: 40px 20px; }
            .container { padding: 40px; border-radius: 20px; }
            h1 { font-size: 2rem; }
            .header-controls { width: auto; }
            .donate-btn { flex: unset; }
            .realm-config-grid { grid-template-columns: 1fr 2fr; }
            .controls-grid { grid-template-columns: 2fr 1fr 1fr; }
            .summary-grid { grid-template-columns: repeat(4, 1fr); }
            .action-row-buttons { flex-direction: row; }
            table { font-size: 0.95rem; min-width: 100%; }
            .recipe-card { padding: 30px; }
        }
    </style>
</head>
<body class="theme-goblin">
    
    <div class="container">
        <header>
            <h1 id="app-title">WoW Crafting Hub</h1>
            <div class="header-controls">
                <a href="https://ko-fi.com/vallejosemmiiii" target="_blank" class="donate-btn">☕ Donar</a>
                <select id="theme-selector" style="width: auto;" title="Tema Visual">
                    <option value="goblin">🟡 Goblin</option>
                    <option value="alliance">🔵 Alliance</option>
                    <option value="horde">🔴 Horde</option>
                    <option value="fel">🟢 Fel</option>
                </select>
                <select id="lang-selector" style="width: auto;">
                    <option value="es">ES</option>
                    <option value="en">EN</option>
                </select>
            </div>
        </header>

        <div class="ad-banner">
            <span>[Espacio Publicitario / Google AdSense]</span>
        </div>

        <div class="nav-tabs">
            <button class="tab-btn active" data-tab="tab-calculator">🧮 Calculadora</button>
            <button class="tab-btn" data-tab="tab-budget">💰 Presupuesto</button>
            <button class="tab-btn" data-tab="tab-flips">📈 Flips</button>
            <button class="tab-btn" data-tab="tab-session">📊 Sesión</button>
        </div>

        <div class="realm-config-grid">
            <div class="control-group">
                <label>Región:</label>
                <select id="region-selector">
                    <option value="us">US (América)</option>
                    <option value="eu">EU (Europa)</option>
                    <option value="kr">KR (Corea)</option>
                    <option value="tw">TW (Taiwán)</option>
                </select>
            </div>
            <div class="control-group">
                <label id="lbl-realm">Servidor de Juego:</label>
                <select id="realm-selector">
                    <option value="" id="opt-default-realm">Selecciona tu servidor...</option>
                    <option value="quelthalas">Quel'Thalas (US)</option>
                    <option value="ragnaros">Ragnaros (US)</option>
                    <option value="sanguino">Sanguino (EU - ES)</option>
                    <option value="dun-morogh">Dun Morogh (EU - FR)</option>
                    <option value="blackhand">Blackhand (EU - DE)</option>
                </select>
            </div>
        </div>

        <!-- PESTAÑA 1: CALCULADORA -->
        <div id="tab-calculator" class="tab-content active">
            <div class="controls-grid">
                <div class="control-group">
                    <label id="lbl-craft-qty">Cantidad:</label>
                    <select id="craft-qty-multiplier">
                        <option value="1">x1 Lote</option>
                        <option value="5">x5 Lotes</option>
                        <option value="10">x10 Lotes</option>
                        <option value="20">x20 Lotes</option>
                        <option value="50">x50 Lotes</option>
                    </select>
                </div>
                <div class="control-group" style="grid-column: span 2;">
                    <label id="lbl-search">Buscar Receta:</label>
                    <input type="text" id="recipe-search" placeholder="Ej. Frasco, Gema...">
                </div>
            </div>

            <div class="professions-nav" id="professions-nav">
                <button class="prof-btn active" data-prof="all">Todas</button>
                <button class="prof-btn" data-prof="favorites">⭐ Favoritas</button>
                <button class="prof-btn" data-prof="alchemy">Alquimia</button>
                <button class="prof-btn" data-prof="jewelcrafting">Joyería</button>
                <button class="prof-btn" data-prof="blacksmithing">Herrería</button>
                <button class="prof-btn" data-prof="enchanting">Encantamiento</button>
                <button class="prof-btn" data-prof="leatherworking">Peletería</button>
                <button class="prof-btn" data-prof="tailoring">Sastrería</button>
                <button class="prof-btn" data-prof="engineering">Ingeniería</button>
            </div>

            <div class="control-group" style="margin-bottom: 20px;">
                <label id="lbl-recipe-select">Receta Específica:</label>
                <select id="recipe-selector">
                    <option value="">Selecciona una receta...</option>
                </select>
            </div>

            <button id="calculate-btn" class="main-action-btn">Calcular Ganancias</button>
            <div id="results-container">
                <p id="default-text" style="color: var(--text-muted); text-align: center; margin-top: 40px; font-size: 0.9rem;">Selecciona un servidor y una receta...</p>
            </div>
        </div>

        <!-- PESTAÑA 2: PRESUPUESTO -->
        <div id="tab-budget" class="tab-content">
            <div class="control-group" style="margin-bottom: 15px;">
                <label>Oro Disponible:</label>
                <input type="number" id="budget-input" placeholder="Ej. 10000" value="10000">
            </div>
            <button id="btn-run-budget" class="main-action-btn">Buscar Rentables</button>
            <div id="budget-results" style="margin-top: 20px; overflow-x: auto;"></div>
        </div>

        <!-- PESTAÑA 3: FLIPS -->
        <div id="tab-flips" class="tab-content">
            <button id="btn-run-flips" class="main-action-btn">Escanear Flips</button>
            <div id="flips-results" style="margin-top: 20px; overflow-x: auto;"></div>
        </div>

        <!-- PESTAÑA 4: SESIÓN -->
        <div id="tab-session" class="tab-content">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
                <h3 style="margin: 0; color: var(--accent-gold); font-size: 1.1rem;">Resumen de Crafteos</h3>
                <button id="btn-clear-session" class="secondary-btn" style="padding: 8px 12px; font-size: 0.8rem;">Vaciar</button>
            </div>
            <div id="session-summary-box" class="summary-grid" style="margin-bottom: 20px; grid-template-columns: repeat(2, 1fr);">
                <div class="summary-box"><span>Registrados</span><strong id="session-count">0</strong></div>
                <div class="summary-box"><span>Inversión</span><strong style="color: var(--red);" id="session-cost">0.00g</strong></div>
            </div>
            <div id="session-list" style="overflow-x: auto;"></div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
