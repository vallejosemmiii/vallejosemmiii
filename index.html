<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="app-title">WoW Crafting & Economy Hub</title>
    <style>
        :root {
            --bg-main: #0b0f19;
            --bg-card: #131b2e;
            --bg-input: #1a233a;
            --border-color: #2a3858;
            --accent-gold: #f39c12;
            --accent-glow: rgba(243, 156, 18, 0.2);
            --text-main: #f1f5f9;
            --text-muted: #94a3b8;
            --green: #10b981;
            --red: #ef4444;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-main);
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            margin: 0;
            padding: 30px 20px;
        }

        .container {
            max-width: 1050px;
            margin: 0 auto;
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            padding: 35px;
            border-radius: 16px;
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.7);
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 20px;
        }

        h1 {
            margin: 0;
            font-size: 1.8rem;
            color: var(--accent-gold);
            font-weight: 700;
        }

        select, input {
            background: var(--bg-input);
            color: var(--text-main);
            border: 1px solid var(--border-color);
            padding: 12px 14px;
            border-radius: 8px;
            font-size: 0.95rem;
            outline: none;
            transition: all 0.2s ease;
        }

        select:focus, input:focus {
            border-color: var(--accent-gold);
            box-shadow: 0 0 0 3px var(--accent-glow);
        }

        .nav-tabs {
            display: flex;
            gap: 12px;
            margin-bottom: 25px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 12px;
        }

        .tab-btn {
            background: transparent;
            border: none;
            color: var(--text-muted);
            font-size: 1rem;
            font-weight: 600;
            padding: 10px 18px;
            cursor: pointer;
            border-radius: 8px;
            transition: all 0.2s;
        }

        .tab-btn:hover {
            color: var(--text-main);
            background: var(--bg-input);
        }

        .tab-btn.active {
            color: var(--accent-gold);
            background: var(--bg-input);
            border: 1px solid var(--border-color);
        }

        .controls-grid {
            display: grid;
            grid-template-columns: 2fr 1fr 1fr;
            gap: 20px;
            margin-bottom: 25px;
        }

        .control-group label {
            display: block;
            font-size: 0.8rem;
            color: var(--text-muted);
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: 600;
        }

        .professions-nav {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-bottom: 25px;
        }

        .prof-btn {
            background: var(--bg-input);
            border: 1px solid var(--border-color);
            color: var(--text-muted);
            padding: 9px 16px;
            border-radius: 30px;
            cursor: pointer;
            font-size: 0.9rem;
            font-weight: 500;
            transition: all 0.2s;
        }

        .prof-btn:hover {
            color: var(--text-main);
            border-color: var(--accent-gold);
        }

        .prof-btn.active {
            background: var(--accent-gold);
            color: #0b0f19;
            border-color: var(--accent-gold);
            font-weight: 700;
        }

        .main-action-btn {
            background: linear-gradient(135deg, #f39c12, #d35400);
            color: #fff;
            border: none;
            padding: 15px;
            font-weight: 700;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            font-size: 1.1rem;
            transition: filter 0.2s;
        }

        .main-action-btn:hover { filter: brightness(1.1); }

        .recipe-card {
            background: rgba(11, 15, 25, 0.6);
            border: 1px solid var(--border-color);
            padding: 30px;
            border-radius: 12px;
            border-left: 5px solid var(--accent-gold);
            margin-top: 25px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.95rem;
            margin: 20px 0;
        }

        th {
            background: #1a233a;
            color: var(--text-muted);
            text-align: left;
            padding: 12px;
            font-weight: 600;
            font-size: 0.85rem;
            text-transform: uppercase;
        }

        td {
            padding: 12px;
            border-bottom: 1px solid var(--border-color);
        }

        .summary-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            background: #0b0f19;
            padding: 20px;
            border-radius: 10px;
            border: 1px solid var(--border-color);
            text-align: center;
            margin-top: 25px;
        }

        .summary-box span {
            font-size: 0.75rem;
            color: var(--text-muted);
            display: block;
            margin-bottom: 6px;
            text-transform: uppercase;
            font-weight: 600;
        }

        .summary-box strong {
            font-size: 1.3rem;
            font-weight: 700;
        }

        .badge-thermometer {
            display: inline-block;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 700;
            letter-spacing: 0.5px;
            margin-top: 10px;
        }

        .badge-green { background: rgba(16, 185, 129, 0.2); color: var(--green); border: 1px solid var(--green); }
        .badge-yellow { background: rgba(243, 156, 18, 0.2); color: var(--accent-gold); border: 1px solid var(--accent-gold); }
        .badge-red { background: rgba(239, 68, 68, 0.2); color: var(--red); border: 1px solid var(--red); }

        .action-row-buttons {
            display: flex;
            gap: 12px;
            margin-top: 20px;
        }

        .secondary-btn {
            background: var(--bg-input);
            color: var(--text-main);
            border: 1px solid var(--border-color);
            padding: 10px 16px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.9rem;
            transition: all 0.2s;
        }

        .secondary-btn:hover {
            border-color: var(--accent-gold);
            color: var(--accent-gold);
        }

        .input-owned {
            width: 65px;
            padding: 6px;
            text-align: center;
            background: var(--bg-main);
            border: 1px solid var(--border-color);
            color: #fff;
            border-radius: 6px;
            font-weight: 600;
        }

        .input-price {
            width: 110px;
            padding: 8px;
            background: var(--bg-main);
            border: 1px solid var(--border-color);
            color: var(--accent-gold);
            font-weight: 700;
            border-radius: 6px;
            text-align: right;
        }

        .fav-btn {
            background: transparent;
            border: none;
            color: var(--text-muted);
            font-size: 1.5rem;
            cursor: pointer;
            transition: transform 0.2s;
        }
        .fav-btn.active { color: var(--accent-gold); }

        .tab-content { display: none; }
        .tab-content.active { display: block; }
    </style>
</head>
<body>
    
    <div class="container">
        <header>
            <h1 id="app-title">WoW Crafting & Economy Hub</h1>
            <select id="lang-selector">
                <option value="es">Español</option>
                <option value="en">English</option>
                <option value="de">Deutsch</option>
                <option value="fr">Français</option>
                <option value="pt">Português</option>
            </select>
        </header>

        <!-- Navegación de Pestañas Principales -->
        <div class="nav-tabs">
            <button class="tab-btn active" data-tab="tab-calculator" id="btn-tab-calc">🧮 Calculadora</button>
            <button class="tab-btn" data-tab="tab-budget" id="btn-tab-budget">💰 Calculadora Inversa (Presupuesto)</button>
            <button class="tab-btn" data-tab="tab-flips" id="btn-tab-flips">📈 Detector de Flips</button>
            <button class="tab-btn" data-tab="tab-session" id="btn-tab-session">📊 Sesión de Crafteo</button>
        </div>

        <!-- Servidor Global -->
        <div class="control-group" style="margin-bottom: 25px;">
            <label id="lbl-realm">Servidor de Juego:</label>
            <select id="realm-selector" style="width: 100%;">
                <option value="" id="opt-default-realm">Selecciona tu servidor...</option>
                <option value="quelthalas">Quel'Thalas (US)</option>
                <option value="ragnaros">Ragnaros (US)</option>
                <option value="sanguino">Sanguino (EU - ES)</option>
                <option value="dun-morogh">Dun Morogh (EU - FR)</option>
                <option value="blackhand">Blackhand (EU - DE)</option>
            </select>
        </div>

        <!-- PESTAÑA 1: CALCULADORA -->
        <div id="tab-calculator" class="tab-content active">
            <div class="controls-grid">
                <div class="control-group">
                    <label id="lbl-craft-qty">Cantidad a Craftear:</label>
                    <select id="craft-qty-multiplier" style="width: 100%;">
                        <option value="1">x1 Lote</option>
                        <option value="5">x5 Lotes</option>
                        <option value="10">x10 Lotes</option>
                        <option value="20">x20 Lotes</option>
                        <option value="50">x50 Lotes</option>
                    </select>
                </div>
                <div class="control-group" style="grid-column: span 2;">
                    <label id="lbl-search">Buscar Receta o Ítem:</label>
                    <input type="text" id="recipe-search" style="width: 100%; box-sizing: border-box;" placeholder="Ej. Frasco, Gema, Bismuto...">
                </div>
            </div>

            <div class="professions-nav" id="professions-nav">
                <button class="prof-btn active" data-prof="all" id="btn-prof-all">Todas</button>
                <button class="prof-btn" data-prof="favorites" id="btn-prof-fav">⭐ Favoritas</button>
                <button class="prof-btn" data-prof="alchemy" id="btn-prof-alchemy">Alquimia</button>
                <button class="prof-btn" data-prof="jewelcrafting" id="btn-prof-jc">Joyería</button>
                <button class="prof-btn" data-prof="blacksmithing" id="btn-prof-bs">Herrería</button>
                <button class="prof-btn" data-prof="enchanting" id="btn-prof-enc">Encantamiento</button>
                <button class="prof-btn" data-prof="leatherworking" id="btn-prof-lw">Peletería</button>
                <button class="prof-btn" data-prof="tailoring" id="btn-prof-tail">Sastrería</button>
                <button class="prof-btn" data-prof="engineering" id="btn-prof-eng">Ingeniería</button>
            </div>

            <div class="control-group" style="margin-bottom: 25px;">
                <label id="lbl-recipe-select">Seleccionar Receta Específica:</label>
                <select id="recipe-selector" style="width: 100%;">
                    <option value="" id="opt-default-recipe">Selecciona una receta del catálogo...</option>
                </select>
            </div>

            <button id="calculate-btn" class="main-action-btn">Calcular Ganancias en Vivo</button>
            <div id="results-container">
                <p id="default-text" style="color: var(--text-muted); text-align: center; margin-top: 50px;">Selecciona un servidor y una receta para consultar la Casa de Subastas...</p>
            </div>
        </div>

        <!-- PESTAÑA 2: CALCULADORA INVERSA (PRESUPUESTO) -->
        <div id="tab-budget" class="tab-content">
            <div class="control-group" style="margin-bottom: 20px;">
                <label id="lbl-budget-gold">Ingresa tu Oro Disponible (Golds):</label>
                <input type="number" id="budget-input" style="width: 100%; box-sizing: border-box;" placeholder="Ej. 10000" value="10000">
            </div>
            <button id="btn-run-budget" class="main-action-btn">Buscar Recetas Rentables por Mi Presupuesto</button>
            <div id="budget-results" style="margin-top: 25px;"></div>
        </div>

        <!-- PESTAÑA 3: DETECTOR DE FLIPS -->
        <div id="tab-flips" class="tab-content">
            <button id="btn-run-flips" class="main-action-btn">Escanear Oportunidades de Flip y Transformación</button>
            <div id="flips-results" style="margin-top: 25px;"></div>
        </div>

        <!-- PESTAÑA 4: SESIÓN DE CRAFTEO -->
        <div id="tab-session" class="tab-content">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
                <h3 style="margin: 0; color: var(--accent-gold);" id="lbl-session-title">Resumen de la Jornada de Crafteo</h3>
                <button id="btn-clear-session" class="secondary-btn">Vaciar Sesión</button>
            </div>
            <div id="session-summary-box" class="summary-grid" style="margin-bottom: 25px;">
                <div class="summary-box"><span>Crafteos Registrados</span><strong id="session-count">0</strong></div>
                <div class="summary-box"><span>Inversión Total</span><strong style="color: var(--red);" id="session-cost">0.00g</strong></div>
                <div class="summary-box"><span>Ganancia Neta Est.</span><strong style="color: var(--green);" id="session-profit">0.00g</strong></div>
            </div>
            <div id="session-list"></div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
