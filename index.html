<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="app-title">WoW Crafting & Economy Hub</title>
    <style>
        :root {
            --bg-main: #060913;
            --bg-card: rgba(15, 23, 42, 0.88);
            --bg-input: rgba(30, 41, 59, 0.75);
            --border-color: rgba(51, 65, 85, 0.8);
            --accent-gold: #f59e0b;
            --accent-glow: rgba(245, 158, 11, 0.25);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --green: #10b981;
            --red: #ef4444;
        }

        body.theme-alliance { --accent-gold: #3b82f6; --accent-glow: rgba(59, 130, 246, 0.25); }
        body.theme-horde { --accent-gold: #dc2626; --accent-glow: rgba(220, 38, 38, 0.25); }
        body.theme-fel { --accent-gold: #10b981; --accent-glow: rgba(16, 185, 129, 0.25); }

        body {
            background-color: var(--bg-main);
            background-image: 
                radial-gradient(circle at 50% 10%, var(--accent-glow) 0%, transparent 60%),
                radial-gradient(circle at 90% 90%, rgba(30, 58, 138, 0.15) 0%, transparent 50%),
                linear-gradient(rgba(6, 9, 19, 0.92), rgba(6, 9, 19, 0.98));
            background-attachment: fixed;
            color: var(--text-main);
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            margin: 0;
            padding: 40px 20px;
            min-height: 100vh;
        }

        .container {
            max-width: 1100px;
            margin: 0 auto;
            background: var(--bg-card);
            backdrop-filter: blur(12px);
            border: 1px solid var(--border-color);
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.8), 0 0 40px var(--accent-glow);
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 20px;
            flex-wrap: wrap;
            gap: 15px;
        }

        h1 {
            margin: 0;
            font-size: 2rem;
            color: var(--accent-gold);
            font-weight: 800;
            letter-spacing: -0.5px;
        }

        .header-controls {
            display: flex;
            gap: 10px;
            align-items: center;
            flex-wrap: wrap;
        }

        .donate-btn {
            background: linear-gradient(135deg, #e11d48, #be123c);
            color: #fff;
            border: none;
            padding: 10px 16px;
            border-radius: 10px;
            font-weight: 700;
            font-size: 0.9rem;
            cursor: pointer;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            box-shadow: 0 4px 15px rgba(225, 29, 72, 0.3);
            transition: all 0.2s;
        }
        .donate-btn:hover { filter: brightness(1.1); transform: translateY(-1px); }

        .ad-banner {
            background: rgba(30, 41, 59, 0.4);
            border: 1px dashed var(--border-color);
            text-align: center;
            padding: 15px;
            border-radius: 12px;
            color: var(--text-muted);
            font-size: 0.85rem;
            margin-bottom: 25px;
        }

        select, input {
            background: var(--bg-input);
            color: var(--text-main);
            border: 1px solid var(--border-color);
            padding: 12px 16px;
            border-radius: 10px;
            font-size: 0.95rem;
            outline: none;
            transition: all 0.25s ease;
        }

        select:focus, input:focus {
            border-color: var(--accent-gold);
            box-shadow: 0 0 0 3px var(--accent-glow);
            background: rgba(30, 41, 59, 0.95);
        }

        .nav-tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 30px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 15px;
            flex-wrap: wrap;
        }

        .tab-btn {
            background: transparent;
            border: 1px solid transparent;
            color: var(--text-muted);
            font-size: 0.95rem;
            font-weight: 600;
            padding: 10px 20px;
            cursor: pointer;
            border-radius: 10px;
            transition: all 0.2s ease;
        }

        .tab-btn:hover {
            color: var(--text-main);
            background: rgba(255, 255, 255, 0.03);
            border-color: var(--border-color);
        }

        .tab-btn.active {
            color: var(--accent-gold);
            background: var(--accent-glow);
            border: 1px solid var(--accent-gold);
        }

        .realm-config-grid {
            display: grid;
            grid-template-columns: 1fr 2fr;
            gap: 15px;
            margin-bottom: 25px;
        }

        .controls-grid {
            display: grid;
            grid-template-columns: 2fr 1fr 1fr;
            gap: 20px;
            margin-bottom: 25px;
        }

        .control-group label {
            display: block;
            font-size: 0.75rem;
            color: var(--text-muted);
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 1.2px;
            font-weight: 700;
        }

        .professions-nav {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-bottom: 25px;
        }

        .prof-btn {
            background: var(--bg-input);
            border: 1px solid var(--border-color);
            color: var(--text-muted);
            padding: 8px 16px;
            border-radius: 25px;
            cursor: pointer;
            font-size: 0.88rem;
            font-weight: 600;
            transition: all 0.2s;
        }

        .prof-btn:hover {
            color: var(--text-main);
            border-color: var(--accent-gold);
        }

        .prof-btn.active {
            background: var(--accent-gold);
            color: #060913;
            border-color: var(--accent-gold);
            font-weight: 800;
            box-shadow: 0 4px 15px var(--accent-glow);
        }

        .main-action-btn {
            background: linear-gradient(135deg, var(--accent-gold), #b45309);
            color: #060913;
            border: none;
            padding: 16px;
            font-weight: 800;
            border-radius: 12px;
            cursor: pointer;
            width: 100%;
            font-size: 1.05rem;
            letter-spacing: 0.5px;
            box-shadow: 0 4px 20px var(--accent-glow);
            transition: all 0.2s ease;
        }

        .main-action-btn:hover { filter: brightness(1.1); transform: translateY(-2px); }

        .recipe-card {
            background: rgba(10, 15, 30, 0.6);
            border: 1px solid var(--border-color);
            padding: 30px;
            border-radius: 16px;
            border-left: 5px solid var(--accent-gold);
            margin-top: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.95rem;
            margin: 20px 0;
        }

        th {
            background: rgba(30, 41, 59, 0.8);
            color: var(--text-muted);
            text-align: left;
            padding: 14px;
            font-weight: 700;
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 0.8px;
        }

        th:first-child { border-top-left-radius: 10px; border-bottom-left-radius: 10px; }
        th:last-child { border-top-right-radius: 10px; border-bottom-right-radius: 10px; }

        td { padding: 14px; border-bottom: 1px solid var(--border-color); }
        tr:hover td { background: rgba(255, 255, 255, 0.015); }

        .summary-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 15px;
            background: rgba(6, 9, 19, 0.7);
            padding: 20px;
            border-radius: 12px;
            border: 1px solid var(--border-color);
            text-align: center;
            margin-top: 25px;
        }

        .summary-box span {
            font-size: 0.72rem;
            color: var(--text-muted);
            display: block;
            margin-bottom: 6px;
            text-transform: uppercase;
            font-weight: 700;
        }

        .summary-box strong { font-size: 1.25rem; font-weight: 800; }

        .badge-thermometer {
            display: inline-block;
            padding: 6px 14px;
            border-radius: 30px;
            font-size: 0.85rem;
            font-weight: 800;
            margin-top: 10px;
        }

        .badge-green { background: rgba(16, 185, 129, 0.15); color: var(--green); border: 1px solid rgba(16, 185, 129, 0.4); }
        .badge-yellow { background: rgba(245, 158, 11, 0.15); color: var(--accent-gold); border: 1px solid rgba(245, 158, 11, 0.4); }
        .badge-red { background: rgba(239, 68, 68, 0.15); color: var(--red); border: 1px solid rgba(239, 68, 68, 0.4); }

        .action-row-buttons { display: flex; gap: 15px; margin-top: 25px; }

        .secondary-btn {
            background: var(--bg-input);
            color: var(--text-main);
            border: 1px solid var(--border-color);
            padding: 12px 20px;
            border-radius: 10px;
            cursor: pointer;
            font-weight: 700;
            font-size: 0.9rem;
            transition: all 0.2s;
        }
        .secondary-btn:hover { border-color: var(--accent-gold); color: var(--accent-gold); background: var(--accent-glow); }

        .input-owned {
            width: 70px;
            padding: 8px;
            text-align: center;
            background: var(--bg-main);
            border: 1px solid var(--border-color);
            color: #fff;
            border-radius: 8px;
            font-weight: 700;
        }

        .input-price {
            width: 120px;
            padding: 10px;
            background: var(--bg-main);
            border: 1px solid var(--border-color);
            color: var(--accent-gold);
            font-weight: 800;
            border-radius: 8px;
            text-align: right;
        }

        .fav-btn {
            background: transparent;
            border: none;
            color: var(--text-muted);
            font-size: 1.6rem;
            cursor: pointer;
            transition: transform 0.2s ease;
        }
        .fav-btn:hover { transform: scale(1.15); }
        .fav-btn.active { color: var(--accent-gold); text-shadow: 0 0 10px var(--accent-glow); }

        .tab-content { display: none; }
        .tab-content.active { display: block; animation: fadeIn 0.3s ease; }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(6px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body class="theme-goblin">
    
    <div class="container">
        <header>
            <h1 id="app-title">WoW Crafting & Economy Hub</h1>
            <div class="header-controls">
                <!-- Tu enlace de Ko-fi ya está conectado aquí -->
                <a href="https://ko-fi.com/vallejosemmiiii" target="_blank" class="donate-btn">☕ Invítame un Café</a>
                <select id="theme-selector" title="Tema Visual">
                    <option value="goblin">🟡 Goblin</option>
                    <option value="alliance">🔵 Alliance</option>
                    <option value="horde">🔴 Horde</option>
                    <option value="fel">🟢 Fel</option>
                </select>
                <select id="lang-selector">
                    <option value="es">Español</option>
                    <option value="en">English</option>
                </select>
            </div>
        </header>

        <div class="ad-banner">
            <span>[Espacio Publicitario / Anuncio de Google AdSense]</span>
        </div>

        <div class="nav-tabs">
            <button class="tab-btn active" data-tab="tab-calculator">🧮 Calculadora & ROI</button>
            <button class="tab-btn" data-tab="tab-budget">💰 Presupuesto & Favoritos</button>
            <button class="tab-btn" data-tab="tab-flips">📈 Detector de Flips</button>
            <button class="tab-btn" data-tab="tab-session">📊 Sesión de Crafteo</button>
        </div>

        <div class="realm-config-grid">
            <div class="control-group">
                <label>Región:</label>
                <select id="region-selector" style="width: 100%;">
                    <option value="us">US (América)</option>
                    <option value="eu">EU (Europa)</option>
                    <option value="kr">KR (Corea)</option>
                    <option value="tw">TW (Taiwán)</option>
                </select>
            </div>
            <div class="control-group">
                <label id="lbl-realm">Servidor de Juego:</label>
                <select id="realm-selector" style="width: 100%;">
                    <option value="" id="opt-default-realm">Selecciona tu servidor...</option>
                    <option value="quelthalas">Quel'Thalas (US)</option>
                    <option value="ragnaros">Ragnaros (US)</option>
                    <option value="sanguino">Sanguino (EU - ES)</option>
                    <option value="dun-morogh">Dun Morogh (EU - FR)</option>
                    <option value="blackhand">Blackhand (EU - DE)</option>
                </select>
            </div>
        </div>

        <div id="tab-calculator" class="tab-content active">
            <div class="controls-grid">
                <div class="control-group">
                    <label id="lbl-craft-qty">Cantidad a Craftear:</label>
                    <select id="craft-qty-multiplier" style="width: 100%;">
                        <option value="1">x1 Lote</option>
                        <option value="5">x5 Lotes</option>
                        <option value="10">x10 Lotes</option>
                        <option value="20">x20 Lotes</option>
                        <option value="50">x50 Lotes</option>
                    </select>
                </div>
                <div class="control-group" style="grid-column: span 2;">
                    <label id="lbl-search">Buscar Receta o Ítem:</label>
                    <input type="text" id="recipe-search" style="width: 100%; box-sizing: border-box;" placeholder="Ej. Frasco, Gema, Bismuto...">
                </div>
            </div>

            <div class="professions-nav" id="professions-nav">
                <button class="prof-btn active" data-prof="all">Todas</button>
                <button class="prof-btn" data-prof="favorites">⭐ Favoritas</button>
                <button class="prof-btn" data-prof="alchemy">Alquimia</button>
                <button class="prof-btn" data-prof="jewelcrafting">Joyería</button>
                <button class="prof-btn" data-prof="blacksmithing">Herrería</button>
                <button class="prof-btn" data-prof="enchanting">Encantamiento</button>
                <button class="prof-btn" data-prof="leatherworking">Peletería</button>
                <button class="prof-btn" data-prof="tailoring">Sastrería</button>
                <button class="prof-btn" data-prof="engineering">Ingeniería</button>
            </div>

            <div class="control-group" style="margin-bottom: 25px;">
                <label id="lbl-recipe-select">Seleccionar Receta Específica:</label>
                <select id="recipe-selector" style="width: 100%;">
                    <option value="">Selecciona una receta del catálogo...</option>
                </select>
            </div>

            <button id="calculate-btn" class="main-action-btn">Calcular Ganancias en Vivo</button>
            <div id="results-container">
                <p id="default-text" style="color: var(--text-muted); text-align: center; margin-top: 50px;">Selecciona un servidor y una receta para consultar la Casa de Subastas...</p>
            </div>
        </div>

        <div id="tab-budget" class="tab-content">
            <div class="control-group" style="margin-bottom: 20px;">
                <label>Ingresa tu Oro Disponible (Golds):</label>
                <input type="number" id="budget-input" style="width: 100%; box-sizing: border-box;" placeholder="Ej. 10000" value="10000">
            </div>
            <button id="btn-run-budget" class="main-action-btn">Buscar Recetas Rentables por Mi Presupuesto</button>
            <div id="budget-results" style="margin-top: 25px;"></div>
        </div>

        <div id="tab-flips" class="tab-content">
            <button id="btn-run-flips" class="main-action-btn">Escanear Oportunidades de Flip y Transformación</button>
            <div id="flips-results" style="margin-top: 25px;"></div>
        </div>

        <div id="tab-session" class="tab-content">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
                <h3 style="margin: 0; color: var(--accent-gold);">Resumen de la Jornada de Crafteo</h3>
                <button id="btn-clear-session" class="secondary-btn">Vaciar Sesión</button>
            </div>
            <div id="session-summary-box" class="summary-grid" style="margin-bottom: 25px; grid-template-columns: repeat(3, 1fr);">
                <div class="summary-box"><span>Crafteos Registrados</span><strong id="session-count">0</strong></div>
                <div class="summary-box"><span>Inversión Total</span><strong style="color: var(--red);" id="session-cost">0.00g</strong></div>
                <div class="summary-box"><span>Ganancia Neta Est.</span><strong style="color: var(--green);" id="session-profit">0.00g</strong></div>
            </div>
            <div id="session-list"></div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
