<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora de Crafteo WoW</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1 id="app-title">Calculadora de Crafteo WoW</h1>
        <select id="lang-selector">
            <option value="es">Español</option>
            <option value="en">English</option>
            <option value="de">Deutsch</option>
            <option value="fr">Français</option>
            <option value="pt">Português</option>
        </select>
    </header>

    <main>
        <section class="controls">
            <select id="realm-selector">
            <option value="" id="opt-default-realm">Selecciona tu servidor...</option>
            <option value="quelthalas">Quel'Thalas (US)</option>
            <option value="ragnaros">Ragnaros (US)</option>
            <option value="sanguino">Sanguino (EU - ES)</option>
            <option value="dun-morogh">Dun Morogh (EU - FR)</option>
            <option value="blackhand">Blackhand (EU - DE)</option>
        </select>
            <button id="calculate-btn">Calcular Ganancias</button>
        </section>

        <section id="results-container">
            <p>Selecciona un servidor para comenzar...</p>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
