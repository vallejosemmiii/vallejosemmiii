<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="app-title">Calculadora de Crafteo WoW</title>
    <style>
        :root {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --card-hover: #252525;
            --accent: #ffb100;
            --accent-hover: #e09b00;
            --text-main: #e0e0e0;
            --text-muted: #888;
            --border: #333;
            --green: #4CAF50;
            --red: #ff5252;
        }

        body {
            background: var(--bg-color);
            color: var(--text-main);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
            background: var(--card-bg);
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.6);
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            border-bottom: 1px solid var(--border);
            padding-bottom: 15px;
        }

        h1 {
            margin: 0;
            font-size: 1.6rem;
            color: var(--accent);
        }

        select, input {
            background: #2a2a2a;
            color: #fff;
            border: 1px solid var(--border);
            padding: 10px;
            border-radius: 6px;
            font-size: 0.95rem;
            outline: none;
        }

        select:focus, input:focus {
            border-color: var(--accent);
        }

        .controls-grid {
            display: grid;
            grid-template-columns: 2fr 1fr 1fr;
            gap: 15px;
            margin-bottom: 20px;
        }

        .control-group label {
            display: block;
            font-size: 0.85em;
            color: var(--text-muted);
            margin-bottom: 6px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .professions-nav {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin-bottom: 20px;
        }

        .prof-btn {
            background: #2a2a2a;
            border: 1px solid var(--border);
            color: var(--text-main);
            padding: 8px 14px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 0.9rem;
            transition: all 0.2s;
        }

        .prof-btn:hover, .prof-btn.active {
            background: var(--accent);
            color: #121212;
            border-color: var(--accent);
            font-weight: bold;
        }

        .main-action-btn {
            background: var(--accent);
            color: #121212;
            border: none;
            padding: 14px 20px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            width: 100%;
            font-size: 1.1rem;
            transition: background 0.2s;
        }

        .main-action-btn:hover {
            background: var(--accent-hover);
        }

        #results-container {
            margin-top: 30px;
        }

        .recipe-card {
            background: var(--card-hover);
            padding: 25px;
            border-radius: 8px;
            border-left: 5px solid var(--accent);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.95rem;
            margin: 15px 0;
        }

        th {
            background: #2f2f2f;
            color: var(--text-muted);
            text-align: left;
            padding: 10px;
        }

        td {
            padding: 10px;
            border-bottom: 1px solid var(--border);
        }

        .summary-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            background: #151515;
            padding: 15px;
            border-radius: 6px;
            text-align: center;
            margin-top: 20px;
        }

        .summary-box span {
            font-size: 0.8rem;
            color: var(--text-muted);
            display: block;
            margin-bottom: 4px;
            text-transform: uppercase;
        }

        .summary-box strong {
            font-size: 1.2rem;
        }

        .search-box {
            width: 100%;
            box-sizing: border-box;
        }

        .input-owned {
            width: 60px;
            padding: 4px 8px;
            text-align: center;
            background: #1a1a1a;
            border: 1px solid var(--border);
            color: #fff;
            border-radius: 4px;
        }

        .input-price {
            width: 100px;
            padding: 6px;
            background: #1a1a1a;
            border: 1px solid var(--border);
            color: var(--accent);
            font-weight: bold;
            border-radius: 4px;
            text-align: right;
        }

        .fav-btn {
            background: transparent;
            border: none;
            color: #666;
            font-size: 1.4rem;
            cursor: pointer;
            vertical-align: middle;
            transition: color 0.2s;
        }
        .fav-btn.active {
            color: #ffb100;
        }
    </style>
</head>
<body>
    
    <div class="container">
        <header>
            <h1 id="app-title">Calculadora de Crafteo WoW</h1>
            <select id="lang-selector">
                <option value="es">Español</option>
                <option value="en">English</option>
                <option value="de">Deutsch</option>
                <option value="fr">Français</option>
                <option value="pt">Português</option>
            </select>
        </header>

        <!-- Servidor, Cantidad y Buscador -->
        <div class="controls-grid">
            <div class="control-group">
                <label id="lbl-realm">Servidor de Juego:</label>
                <select id="realm-selector" style="width: 100%;">
                    <option value="" id="opt-default-realm">Selecciona tu servidor...</option>
                    <option value="quelthalas">Quel'Thalas (US)</option>
                    <option value="ragnaros">Ragnaros (US)</option>
                    <option value="sanguino">Sanguino (EU - ES)</option>
                    <option value="dun-morogh">Dun Morogh (EU - FR)</option>
                    <option value="blackhand">Blackhand (EU - DE)</option>
                </select>
            </div>
            <div class="control-group">
                <label id="lbl-craft-qty">Cantidad a Craftear:</label>
                <select id="craft-qty-multiplier" style="width: 100%;">
                    <option value="1">x1 Lote</option>
                    <option value="5">x5 Lotes</option>
                    <option value="10">x10 Lotes</option>
                    <option value="20">x20 Lotes</option>
                    <option value="50">x50 Lotes</option>
                </select>
            </div>
            <div class="control-group">
                <label id="lbl-search">Buscar Receta o Ítem:</label>
                <input type="text" id="recipe-search" class="search-box" placeholder="Ej. Frasco, Gema...">
            </div>
        </div>

        <!-- Filtros por Profesión -->
        <div class="professions-nav" id="professions-nav">
            <button class="prof-btn active" data-prof="all" id="btn-prof-all">Todas</button>
            <button class="prof-btn" data-prof="favorites" id="btn-prof-fav">⭐ Favoritas</button>
            <button class="prof-btn" data-prof="alchemy" id="btn-prof-alchemy">Alquimia</button>
            <button class="prof-btn" data-prof="jewelcrafting" id="btn-prof-jc">Joyería</button>
            <button class="prof-btn" data-prof="blacksmithing" id="btn-prof-bs">Herrería</button>
            <button class="prof-btn" data-prof="enchanting" id="btn-prof-enc">Encantamiento</button>
            <button class="prof-btn" data-prof="leatherworking" id="btn-prof-lw">Peletería</button>
            <button class="prof-btn" data-prof="tailoring" id="btn-prof-tail">Sastrería</button>
            <button class="prof-btn" data-prof="engineering" id="btn-prof-eng">Ingeniería</button>
        </div>

        <!-- Selector de Recetas -->
        <div class="control-group" style="margin-bottom: 20px;">
            <label id="lbl-recipe-select">Seleccionar Receta Específica:</label>
            <select id="recipe-selector" style="width: 100%;">
                <option value="" id="opt-default-recipe">Selecciona una receta del catálogo...</option>
            </select>
        </div>

        <button id="calculate-btn" class="main-action-btn">Calcular Ganancias en Vivo</button>

        <!-- Resultados -->
        <div id="results-container">
            <p id="default-text" style="color: var(--text-muted); text-align: center; margin-top: 40px;">Selecciona un servidor y una receta para consultar la Casa de Subastas...</p>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
