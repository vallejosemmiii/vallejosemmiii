<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="app-title">WoW Crafting & Economy Hub</title>
    <style>
        :root {
            --bg-main: #0b0f19;
            --bg-card: #131b2e;
            --bg-input: #1a233a;
            --border-color: #2a3858;
            --accent-gold: #f39c12;
            --accent-glow: rgba(243, 156, 18, 0.2);
            --text-main: #f1f5f9;
            --text-muted: #94a3b8;
            --green: #10b981;
            --red: #ef4444;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-main);
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            margin: 0;
            padding: 30px 20px;
        }

        .container {
            max-width: 1050px;
            margin: 0 auto;
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            padding: 35px;
            border-radius: 16px;
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.7);
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 20px;
        }

        h1 {
            margin: 0;
            font-size: 1.8rem;
            color: var(--accent-gold);
            font-weight: 700;
            letter-spacing: 0.5px;
        }

        select, input {
            background: var(--bg-input);
            color: var(--text-main);
            border: 1px solid var(--border-color);
            padding: 12px 14px;
            border-radius: 8px;
            font-size: 0.95rem;
            outline: none;
            transition: all 0.2s ease;
        }

        select:focus, input:focus {
            border-color: var(--accent-gold);
            box-shadow: 0 0 0 3px var(--accent-glow);
        }

        .controls-grid {
            display: grid;
            grid-template-columns: 2fr 1fr 1fr;
            gap: 20px;
            margin-bottom: 25px;
        }

        .control-group label {
            display: block;
            font-size: 0.8rem;
            color: var(--text-muted);
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: 600;
        }

        .professions-nav {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-bottom: 25px;
        }

        .prof-btn {
            background: var(--bg-input);
            border: 1px solid var(--border-color);
            color: var(--text-muted);
            padding: 9px 16px;
            border-radius: 30px;
            cursor: pointer;
            font-size: 0.9rem;
            font-weight: 500;
            transition: all 0.2s;
        }

        .prof-btn:hover {
            color: var(--text-main);
            border-color: var(--accent-gold);
        }

        .prof-btn.active {
            background: var(--accent-gold);
            color: #0b0f19;
            border-color: var(--accent-gold);
            font-weight: 700;
            box-shadow: 0 0 15px var(--accent-glow);
        }

        .main-action-btn {
            background: linear-gradient(135deg, #f39c12, #d35400);
            color: #fff;
            border: none;
            padding: 15px;
            font-weight: 700;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            font-size: 1.1rem;
            letter-spacing: 0.5px;
            transition: transform 0.1s ease, filter 0.2s;
        }

        .main-action-btn:hover {
            filter: brightness(1.1);
        }

        .main-action-btn:active {
            transform: scale(0.99);
        }

        #results-container {
            margin-top: 35px;
        }

        .recipe-card {
            background: rgba(11, 15, 25, 0.6);
            border: 1px solid var(--border-color);
            padding: 30px;
            border-radius: 12px;
            border-left: 5px solid var(--accent-gold);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.95rem;
            margin: 20px 0;
        }

        th {
            background: #1a233a;
            color: var(--text-muted);
            text-align: left;
            padding: 12px;
            font-weight: 600;
            font-size: 0.85rem;
            text-transform: uppercase;
        }

        th:first-child { border-top-left-radius: 6px; border-bottom-left-radius: 6px; }
        th:last-child { border-top-right-radius: 6px; border-bottom-right-radius: 6px; }

        td {
            padding: 12px;
            border-bottom: 1px solid var(--border-color);
        }

        .summary-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            background: #0b0f19;
            padding: 20px;
            border-radius: 10px;
            border: 1px solid var(--border-color);
            text-align: center;
            margin-top: 25px;
        }

        .summary-box span {
            font-size: 0.75rem;
            color: var(--text-muted);
            display: block;
            margin-bottom: 6px;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: 600;
        }

        .summary-box strong {
            font-size: 1.3rem;
            font-weight: 700;
        }

        .search-box {
            width: 100%;
            box-sizing: border-box;
        }

        .input-owned {
            width: 65px;
            padding: 6px;
            text-align: center;
            background: var(--bg-main);
            border: 1px solid var(--border-color);
            color: #fff;
            border-radius: 6px;
            font-weight: 600;
        }

        .input-price {
            width: 110px;
            padding: 8px;
            background: var(--bg-main);
            border: 1px solid var(--border-color);
            color: var(--accent-gold);
            font-weight: 700;
            border-radius: 6px;
            text-align: right;
        }

        .fav-btn {
            background: transparent;
            border: none;
            color: var(--text-muted);
            font-size: 1.5rem;
            cursor: pointer;
            vertical-align: middle;
            transition: color 0.2s, transform 0.2s;
        }
        .fav-btn:hover { transform: scale(1.1); }
        .fav-btn.active {
            color: var(--accent-gold);
            text-shadow: 0 0 10px var(--accent-glow);
        }
    </style>
</head>
<body>
    
    <div class="container">
        <header>
            <h1 id="app-title">WoW Crafting & Economy Hub</h1>
            <select id="lang-selector">
                <option value="es">Español</option>
                <option value="en">English</option>
                <option value="de">Deutsch</option>
                <option value="fr">Français</option>
                <option value="pt">Português</option>
            </select>
        </header>

        <!-- Controles Principales -->
        <div class="controls-grid">
            <div class="control-group">
                <label id="lbl-realm">Servidor de Juego:</label>
                <select id="realm-selector" style="width: 100%;">
                    <option value="" id="opt-default-realm">Selecciona tu servidor...</option>
                    <option value="quelthalas">Quel'Thalas (US)</option>
                    <option value="ragnaros">Ragnaros (US)</option>
                    <option value="sanguino">Sanguino (EU - ES)</option>
                    <option value="dun-morogh">Dun Morogh (EU - FR)</option>
                    <option value="blackhand">Blackhand (EU - DE)</option>
                </select>
            </div>
            <div class="control-group">
                <label id="lbl-craft-qty">Cantidad a Craftear:</label>
                <select id="craft-qty-multiplier" style="width: 100%;">
                    <option value="1">x1 Lote</option>
                    <option value="5">x5 Lotes</option>
                    <option value="10">x10 Lotes</option>
                    <option value="20">x20 Lotes</option>
                    <option value="50">x50 Lotes</option>
                </select>
            </div>
            <div class="control-group">
                <label id="lbl-search">Buscar Receta o Ítem:</label>
                <input type="text" id="recipe-search" class="search-box" placeholder="Ej. Frasco, Gema...">
            </div>
        </div>

        <!-- Filtros por Profesión -->
        <div class="professions-nav" id="professions-nav">
            <button class="prof-btn active" data-prof="all" id="btn-prof-all">Todas</button>
            <button class="prof-btn" data-prof="favorites" id="btn-prof-fav">⭐ Favoritas</button>
            <button class="prof-btn" data-prof="alchemy" id="btn-prof-alchemy">Alquimia</button>
            <button class="prof-btn" data-prof="jewelcrafting" id="btn-prof-jc">Joyería</button>
            <button class="prof-btn" data-prof="blacksmithing" id="btn-prof-bs">Herrería</button>
            <button class="prof-btn" data-prof="enchanting" id="btn-prof-enc">Encantamiento</button>
            <button class="prof-btn" data-prof="leatherworking" id="btn-prof-lw">Peletería</button>
            <button class="prof-btn" data-prof="tailoring" id="btn-prof-tail">Sastrería</button>
            <button class="prof-btn" data-prof="engineering" id="btn-prof-eng">Ingeniería</button>
        </div>

        <!-- Selector de Recetas -->
        <div class="control-group" style="margin-bottom: 25px;">
            <label id="lbl-recipe-select">Seleccionar Receta Específica:</label>
            <select id="recipe-selector" style="width: 100%;">
                <option value="" id="opt-default-recipe">Selecciona una receta del catálogo...</option>
            </select>
        </div>

        <button id="calculate-btn" class="main-action-btn">Calcular Ganancias en Vivo</button>

        <!-- Resultados -->
        <div id="results-container">
            <p id="default-text" style="color: var(--text-muted); text-align: center; margin-top: 50px; font-size: 1.05rem;">Selecciona un servidor y una receta para consultar la Casa de Subastas...</p>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
